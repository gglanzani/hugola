<header class="site-header">
  <a href="/" class="site-logo">{{ .Site.Title }}</a>
  <nav class="site-nav">
    {{ range .Site.Menus.main }}
      {{- $isActive := and (gt (len .URL) 1) (strings.HasPrefix $.Page.RelPermalink .URL) -}}
      <a href="{{ .URL }}"{{ if $isActive }} class="is-active" aria-current="page"{{ end }}>{{ .Name }}</a>
    {{ end }}
    <a href="{{ $.Site.Params.Rss | default "/index.xml" }}" class="btn-pill">subscribe</a>
  </nav>
</header>
